name: neura_editor
description: Environment editor for Neura.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0-10.0.dev

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.37.0
  cupertino_icons: ^1.0.8
  neura_assets:
    path: ../../packages/neura_assets
  neura_rendering:
    path: ../../packages/neura_rendering
  neura_world:
    path: ../../packages/neura_world

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_test: ^2.2.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/editor_surface_lighting.frag
    - shaders/editor_ground_shadow.frag
