name: neura_assets
description: Curated runtime assets shared by Neura applications.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.14.0-10.0.dev

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  neura_world:
    path: ../neura_world

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/characters/female/
    - assets/images/characters/male/
    - assets/catalogs/character_catalog.json
    - assets/debug_scenes/
    - assets/release/
    - assets/release/chunks/
    - assets/release/images/
